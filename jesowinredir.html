<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jesowin_</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* * =============================================
         * Tweakable CSS Variables
         * =============================================
         */
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.14);
            --neon-glow: rgba(255, 255, 255, 0.95);
            --neon-shadow: rgba(255, 255, 255, 0.05);
            --backdrop-blur: 14px;
            --border-radius: 1.25rem;
            --font-primary: 'Inter', sans-serif;
            --font-mono: 'Source Code Pro', monospace;

            /* Animation Timings */
            --transition-duration: 250ms;
            --page-load-duration: 1200ms;
            --type-speed-ms: 120;
            --erase-speed-ms: 60;
            --type-pause-ms: 2000;
            --caret-blink-speed: 700ms;
        }

        /* * =============================================
         * Base & Reset Styles
         * =============================================
         */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
            overflow-x: hidden;
            /* For page load animation */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity var(--page-load-duration) cubic-bezier(0.2, 0.8, 0.2, 1),
                        transform var(--page-load-duration) cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        body.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* * =============================================
         * Main Structure
         * =============================================
         */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            width: 100%;
            max-width: 680px;
        }

        header, main, footer {
            width: 100%;
        }
        
        /* * =============================================
         * Header & Typewriter Effect
         * =============================================
         */
        .header-title {
            font-family: var(--font-mono);
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-color);
            display: inline-block;
            height: clamp(2.5rem, 8vw, 4rem); /* Set fixed height to prevent layout shift */
        }

        .header-title .caret {
            display: inline-block;
            width: 3px;
            height: 1em; /* Relative to font size */
            background-color: var(--neon-glow);
            vertical-align: bottom;
            opacity: 0;
            box-shadow: 0 0 8px var(--neon-glow);
        }
        
        .header-title .caret.blink {
            animation: blink var(--caret-blink-speed) infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* * =============================================
         * Link Buttons & Glassmorphism
         * =============================================
         */
        .link-nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 28px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 1rem;
            
            background-color: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 12px var(--neon-shadow);

            /* Frosted glass effect */
            backdrop-filter: blur(var(--backdrop-blur));
            -webkit-backdrop-filter: blur(var(--backdrop-blur));
            
            /* Prepare for animations */
            will-change: transform, box-shadow;
            transition: transform var(--transition-duration) ease, 
                        box-shadow var(--transition-duration) ease;
        }
        
        .btn:hover,
        .btn:focus-visible {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--neon-shadow), 
                        inset 0 0 0 1px var(--glass-border), /* Inner glow illusion */
                        0 0 15px var(--neon-glow); /* Outer neon rim */
            outline: none;
        }

        .btn:focus-visible {
             box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--neon-glow);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            will-change: filter;
            transition: filter var(--transition-duration) ease;
        }

        .btn:hover svg,
        .btn:focus-visible svg {
            filter: drop-shadow(0 0 8px var(--neon-glow));
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px var(--neon-glow));
            }
            50% {
                transform: scale(1.2);
                filter: drop-shadow(0 0 16px var(--neon-glow));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px var(--neon-glow));
            }
        }
        
        .btn svg.pulse {
            animation: pulse 300ms ease-out;
        }

        /* * =============================================
         * Footer
         * =============================================
         */
        footer {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color var(--transition-duration), border-color var(--transition-duration);
        }

        footer a:hover,
        footer a:focus-visible {
            color: var(--text-color);
            border-bottom-color: var(--neon-glow);
            outline: none;
        }

        /* * =============================================
         * Responsiveness
         * =============================================
         */
        @media (max-width: 768px) {
            .container {
                gap: 2.5rem;
            }

            .link-nav {
                flex-direction: column;
                align-items: center;
                gap: 1.25rem;
            }

            .btn {
                width: 100%;
                max-width: 420px;
                justify-content: center;
                padding: 18px 24px; /* Taller touch targets */
            }
        }
        
        /* * =============================================
         * Accessibility - Reduced Motion
         * =============================================
         */
        @media (prefers-reduced-motion: reduce) {
            body, .btn {
                transition: none;
            }
            
            body.loaded {
                transform: none;
            }

            .btn:hover,
            .btn:focus-visible {
                transform: none;
            }

            .header-title .caret.blink,
            .btn svg.pulse {
                animation: none;
            }
            
            .header-title .caret.blink {
                opacity: 1; /* Keep caret visible */
            }
        }
    </style>
</head>
<body>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Page Load Animation ---
            document.body.classList.add('loaded');
            
            // --- Typewriter Effect ---
            const textElement = document.getElementById('typewriter-text');
            const caretElement = document.getElementById('caret');
            const textToType = 'jesowin_';
            
            // Get timings from CSS variables for easy tweaking
            const typeSpeed = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--type-speed-ms'), 10);
            const eraseSpeed = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--erase-speed-ms'), 10);
            const pauseDuration = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--type-pause-ms'), 10);

            let charIndex = 0;

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function type() {
                caretElement.classList.remove('blink');
                if (charIndex < textToType.length) {
                    textElement.textContent += textToType.charAt(charIndex);
                    charIndex++;
                    setTimeout(type, typeSpeed);
                } else {
                    caretElement.classList.add('blink');
                    setTimeout(erase, pauseDuration);
                }
            }

            function erase() {
                caretElement.classList.remove('blink');
                if (charIndex > 0) {
                    textElement.textContent = textToType.substring(0, charIndex - 1);
                    charIndex--;
                    setTimeout(erase, eraseSpeed);
                } else {
                    caretElement.classList.add('blink');
                    setTimeout(type, typeSpeed * 2);
                }
            }
            
            if (prefersReducedMotion) {
                // If user prefers reduced motion, show text immediately and do not loop
                textElement.textContent = textToType;
                caretElement.classList.add('blink');
            } else {
                // Start the looping typewriter animation
                setTimeout(type, 500);
            }

            // --- Button Click Pulse Effect ---
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    if (prefersReducedMotion) return;

                    const icon = this.querySelector('svg');
                    if (icon) {
                        // Add pulse class. Navigation will happen naturally from the <a> tag.
                        // The browser will attempt to render the animation's start.
                        icon.classList.add('pulse');
                        icon.addEventListener('animationend', () => {
                            icon.classList.remove('pulse');
                        }, { once: true });
                    }
                });
            });
        });
    </script>
